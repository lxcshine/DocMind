# DocMind - Enterprise Document Intelligence Platform
# Docker Compose for full-stack deployment
#
# 启动前请确保 backend/.env 存在并填好 GEMINI_API_KEY / EMBEDDING_API_KEY 等
# 启动:   docker compose up -d
# 停止:   docker compose down
# 重建:   docker compose build --no-cache
# 查看日志: docker compose logs -f backend

services:
  # ===== Backend Service =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docmind-backend:latest
    container_name: docmind-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      # 应用配置
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - LOG_FILE_ENABLED=true
      
      # MySQL 连接（必须和 mysql service 对齐）
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-docmind_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-docmind_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-docmind}
      
      # MCP 配置
      - MCP_ENABLED=${MCP_ENABLED:-true}
      
      # CORS 配置（生产环境建议设置具体域名）
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CORS_ALLOW_WILDCARD=${CORS_ALLOW_WILDCARD:-true}
      
      # API Key 认证（可选，逗号分隔多个 key）
      - API_KEYS=${API_KEYS:-}
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/rag_storage
      - backend-output:/app/output
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - docmind-network
    healthcheck:
      # 使用 Python 内置 urllib 检查健康状态（避免依赖 curl）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # RAG 初始化（模型权重加载）可能 3-5 分钟
      start_period: 300s
    # 资源限制（防止单个服务占用过多资源）
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  # ===== Frontend Service =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建时注入 API 地址（用于 Vite 环境变量）
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    image: docmind-frontend:latest
    container_name: docmind-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # 关键：等 backend 真正 healthy 才起 frontend
    # 否则用户访问 /api/chat 会拿到 502
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - docmind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ===== MySQL Database =====
  mysql:
    image: mysql:8.0
    container_name: docmind-mysql
    # 故意不暴露 3306 到宿主，避免端口冲突
    # 后端走 docmind-network 内部 mysql:3306 即可
    # 仅本地调试时取消下面两行注释：
    # ports:
    #   - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-docmind_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docmind}
      MYSQL_USER: ${MYSQL_USER:-docmind_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-docmind_pass}
      # 字符集配置
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 可选：挂载自定义初始化脚本
      # - ./mysql-init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
    restart: unless-stopped
    networks:
      - docmind-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-docmind_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ===== Ollama (Optional Local Embedding/LLM) =====
  # 需要本地跑开源模型时启用。配合 NVIDIA Container Toolkit：
  # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  # 启用方法：取消下面注释 + backend 环境变量指向 http://ollama:11434
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: docmind-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped
  #   networks:
  #     - docmind-network

volumes:
  mysql-data:
    driver: local
  backend-logs:
    driver: local
  backend-data:
    driver: local
  backend-output:
    driver: local
  backend-uploads:
    driver: local
  # ollama-data:
  #   driver: local

networks:
  docmind-network:
    driver: bridge
    # 可选：自定义网络配置
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16
