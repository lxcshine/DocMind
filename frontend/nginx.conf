server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===== 上传大小限制（与后端 MAX_UPLOAD_SIZE_MB 对齐）=====
    client_max_body_size 100M;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               application/octet-stream;

    # ===== 安全响应头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # ===== SPA 路由 fallback =====
    # 任何非匹配路径都返回 index.html，让前端 Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== API 反向代理到 backend =====
    location /api/ {
        proxy_pass http://backend:8000;

        # ---- SSE / 长连接必需 ----
        # HTTP/1.1 + 清空 Connection 头 → 走 keep-alive 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 标准反向代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 关键 ----
        # 关掉 buffer，chunk 立刻推给客户端
        proxy_buffering off;
        proxy_cache off;

        # ---- 超时 ----
        # LLM 流式输出（特别是 Gemini 思考模式）可能 1 小时+
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ---- 请求体大小 ----
        client_max_body_size 100M;
    }

    # ===== MCP 反向代理到 backend =====
    # MCP (Model Context Protocol) 使用 Streamable HTTP 传输
    location /mcp {
        proxy_pass http://backend:8000;

        # HTTP/1.1 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 标准反向代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（MCP 可能使用流式响应）
        proxy_buffering off;
        proxy_cache off;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== 静态资源长缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== 健康检查端点（供 docker healthcheck 使用）=====
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
