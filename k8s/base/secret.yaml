# DocMind Secrets
# IMPORTANT: Replace placeholder values before deploying to production!
# Consider using Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
# or External Secrets Operator (https://external-secrets.io/) for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: docmind-secrets
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # --- LLM API Keys ---
  GEMINI_API_KEY: "REPLACE_ME_GEMINI_API_KEY"
  VISION_API_KEY: "REPLACE_ME_VISION_API_KEY"
  EMBEDDING_API_KEY: "REPLACE_ME_EMBEDDING_API_KEY"

  # --- MySQL ---
  MYSQL_ROOT_PASSWORD: "REPLACE_ME_MYSQL_ROOT_PASSWORD"
  MYSQL_PASSWORD: "REPLACE_ME_MYSQL_USER_PASSWORD"

  # --- Optional ---
  COHERE_API_KEY: ""
  MCP_BING_API_KEY: ""
  API_KEYS: ""
