# Kustomization - Base layer
# Apply with: kubectl apply -k k8s/base
# Or via overlay: kubectl apply -k k8s/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docmind

# Use commonLabels only for selectors (not on Namespace to avoid conflicts)
commonLabels:
  app.kubernetes.io/part-of: docmind
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - mysql.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

# Images - override with your registry
images:
  - name: docmind-backend
    newTag: latest
  - name: docmind-frontend
    newTag: latest
