# MySQL StatefulSet with persistent storage
# Uses StatefulSet for stable network identity and ordered rolling updates
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: mysql
spec:
  serviceName: mysql-headless
  replicas: 1
  # Ordered rolling update: take one pod down at a time
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: docmind
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docmind
        app.kubernetes.io/component: mysql
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    spec:
      # fsGroup ensures PVC mount points are accessible by mysql user (UID 999)
      securityContext:
        fsGroup: 999
      # Anti-affinity: prefer not to co-locate with other MySQL pods
      # (relevant when scaling to multi-replica with orchestration)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mysql
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: docmind
            - name: MYSQL_USER
              value: docmind_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: MYSQL_PASSWORD
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=caching_sha2_password
            - --max-connections=500
            - --innodb-buffer-pool-size=256M
            - --innodb-log-file-size=64M
            - --binlog-format=ROW
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          # Container-level security context
          # Note: MySQL official image's entrypoint requires root for initialization
          # (chown, mkdir). After init, it drops to mysql user (UID 999) automatically.
          # Using runAsNonRoot would break the entrypoint script.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      # Topology spread for HA across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: mysql
  # VolumeClaimTemplate for persistent storage
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          app.kubernetes.io/name: docmind
          app.kubernetes.io/component: mysql
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard  # Change to your StorageClass
        resources:
          requests:
            storage: 20Gi
---
# Headless Service for StatefulSet network identity
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: mysql
  ports:
    - port: 3306
      name: mysql
      targetPort: 3306
---
# Client Service (stable DNS: mysql.docmind.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: mysql
  ports:
    - port: 3306
      name: mysql
      targetPort: 3306
