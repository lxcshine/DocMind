# Backend Deployment - FastAPI + Uvicorn
# HA: 2+ replicas with PDB, anti-affinity, topology spread
# Rolling update: maxSurge=1, maxUnavailable=0 (zero-downtime)
# Persistence: rag_storage, output, uploads via PVC
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  # Zero-downtime rolling update
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docmind
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docmind
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      # Wait for MySQL before starting backend
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              until nc -z mysql.docmind.svc.cluster.local 3306; do
                echo "MySQL not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "MySQL is ready!"
      containers:
        - name: backend
          image: docmind-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: rag-storage
              mountPath: /app/rag_storage
            - name: output
              mountPath: /app/output
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Startup probe: allow 5 minutes for RAG initialization
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          # Liveness: restart if unhealthy for 90s
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness: remove from Service if not ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            # Don't specify runAsUser - let the image's USER directive control it
            # The Dockerfile creates appuser and sets USER appuser
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: rag-storage
          persistentVolumeClaim:
            claimName: rag-storage
        - name: output
          persistentVolumeClaim:
            claimName: output
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: logs
          persistentVolumeClaim:
            claimName: logs
      # Anti-affinity: spread backend pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: kubernetes.io/hostname
      # Topology spread across zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      terminationGracePeriodSeconds: 60
      # Graceful shutdown: SIGTERM -> 60s drain -> SIGKILL
      # uvicorn handles SIGTERM gracefully
  # Minimum ready seconds before considering pod available
  minReadySeconds: 10
  # Revision history limit for Rollout rollback
  revisionHistoryLimit: 5
---
# Backend Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      name: http
      targetPort: http
---
# PodDisruptionBudget - ensure at least 1 backend pod during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: docmind
  labels:
    app.kubernetes.io/name: docmind
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docmind
      app.kubernetes.io/component: backend
